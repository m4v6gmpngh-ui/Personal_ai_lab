name: web-ingest

on:
  push:
    branches:
      - main
      - web-ingest-actions
      - wb-ingest-v1
    paths:
      - "ingest_requests/*.json"
      - "scripts/web_ingest.py"
      - "scripts/wb_ingest.py"
      - ".github/workflows/web-ingest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ingest approved public sources
        run: python scripts/web_ingest.py --requests ingest_requests --output data/library

      - name: Prepare Writing Bloom measurements and packets
        run: python scripts/wb_ingest.py public-library --library-root data/library --output data/wb_ingest

      - name: Commit normalized public corpus and WB handoff
        shell: bash
        run: |
          if git diff --quiet -- data/library data/wb_ingest && [ -z "$(git status --porcelain -- data/library data/wb_ingest)" ]; then
            echo "No ingestion changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/library data/wb_ingest
          git commit -m "Prepare public source for Writing Bloom"
          git push origin "HEAD:${GITHUB_REF_NAME}"
